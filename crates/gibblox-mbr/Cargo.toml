[package]
name = "gibblox-mbr"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Block reader for MBR partitions."
keywords = ["gibblox"]

[features]
default = []
std = []

[dependencies]
async-trait = "0.1.89"
bytemuck = { version = "1.24.0", default-features = false }
gibblox-core = { workspace = true }
hadris-part = { workspace = true }
# Constrain the shared hadris implementation even in standalone MBR consumers.
hadris-io = { workspace = true }
hadris-macros = { workspace = true }
tracing = { version = "0.1.41", default-features = false, features = ["attributes"] }

[dev-dependencies]
futures = { version = "0.3.31", default-features = false, features = ["executor"] }
